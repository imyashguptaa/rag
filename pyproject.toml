[tool.ruff]
target-version = "py310"  # the code must keep running on 3.10 for local development

[tool.ruff.lint]
# pyflakes and pycodestyle errors, likely bugs, import order, outdated syntax
select = ["E", "F", "B", "I", "UP", "PLE"]
# E501: prompts and test cases are long single lines on purpose
# B905: every zip() here pairs lists built from the same source, so they cannot differ in length
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
