# Render Blueprint. In the Render dashboard: New > Blueprint > pick this repository.
#
# Two ways to run it, measured on the development machine:
#
#   free plan (below)   512 MB RAM, 0.1 CPU. The app uses about 420 MB in hybrid mode, so the
#                       reranker (about 920 MB) is switched off: recall@5 0.84 instead of 0.89.
#                       The service sleeps after 15 minutes without traffic and takes about a
#                       minute to wake. Memory headroom is small.
#   plan: 1c-2g         2 GB RAM, 1 CPU, paid. Runs the full pipeline: delete the
#                       RETRIEVAL_MODE variable below.
#
# The free plan has no persistent disk, so the public corpus and its index are built into the
# image (BAKE_CORPUS). PDFs uploaded through POST /documents are lost when the service restarts.
# To keep uploads, use a paid plan and add a disk mounted at /app/data.
services:
  - type: web
    name: docqa
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy only after CI passes
    envVars:
      - key: GROQ_API_KEY
        sync: false # asked for once, when the Blueprint is created
      - key: API_KEY
        generateValue: true # callers must send this in the X-API-Key header
      - key: BAKE_CORPUS
        value: "1"
      - key: RETRIEVAL_MODE
        value: hybrid
